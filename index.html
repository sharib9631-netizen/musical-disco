<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BattleZone Tournament</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#08090d;
    color:white;
}

header{
    background:linear-gradient(135deg,#ff9800,#ff1e00);
    text-align:center;
    padding:28px 15px;
}

header h1{
    margin:0;
    font-size:42px;
}

header p{
    margin:8px 0 0;
    font-size:22px;
}

.container{
    width:94%;
    max-width:700px;
    margin:25px auto;
}

.card{
    background:#17171e;
    border:1px solid #303039;
    border-radius:25px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.title{
    color:#ff9d00;
    font-size:30px;
    font-weight:bold;
    margin-bottom:20px;
}

input,select{
    width:100%;
    padding:18px;
    margin:8px 0;
    border-radius:17px;
    border:1px solid #3b3b45;
    background:#0d0d12;
    color:white;
    font-size:18px;
    outline:none;
}

input:focus,select:focus{
    border-color:#ff9800;
}

button{
    width:100%;
    padding:18px;
    margin-top:12px;
    border:none;
    border-radius:17px;
    background:linear-gradient(135deg,#ff9800,#ff3000);
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.small-btn{
    padding:13px;
    font-size:16px;
}

.tournament{
    background:#101016;
    border:1px solid #383842;
    border-radius:22px;
    padding:20px;
    margin-top:18px;
}

.badge{
    display:inline-block;
    background:#3d3200;
    color:#ffc107;
    padding:8px 15px;
    border-radius:20px;
    font-size:14px;
    margin-bottom:12px;
}

.tournament h3{
    color:#ff9d00;
    font-size:25px;
    margin:5px 0 15px;
}

.info{
    background:#1b1b23;
    padding:13px;
    margin:8px 0;
    border-radius:14px;
    font-size:17px;
}

.player{
    background:#101016;
    border:1px solid #383842;
    border-radius:20px;
    padding:18px;
    margin-top:15px;
}

.player-name{
    font-size:21px;
    font-weight:bold;
    margin-bottom:8px;
}

.message{
    display:none;
    padding:15px;
    margin-bottom:20px;
    border-radius:15px;
    text-align:center;
    font-weight:bold;
}

.success{
    display:block;
    background:#123d20;
    color:#6cff8c;
}

.error{
    display:block;
    background:#451414;
    color:#ff7777;
}

.loading{
    text-align:center;
    color:#aaa;
    padding:15px;
}

.empty{
    text-align:center;
    color:#888;
    padding:20px;
}

footer{
    text-align:center;
    color:#777;
    padding:30px 10px;
}
</style>
</head>

<body>

<header>
    <h1>⚔️ BattleZone</h1>
    <p>Ultimate Tournament Platform</p>
</header>

<div class="container">

    <div id="message" class="message"></div>

    <!-- CREATE TOURNAMENT -->
    <div class="card">

        <div class="title">🏆 Create Tournament</div>

        <input
            id="tournamentName"
            type="text"
            placeholder="Tournament Name"
        >

        <input
            id="gameName"
            type="text"
            placeholder="Game Name"
        >

        <input
            id="entryFee"
            type="number"
            placeholder="Entry Fee"
            min="0"
        >

        <input
            id="prizePool"
            type="number"
            placeholder="Prize Pool"
            min="0"
        >

        <select id="tournamentType">
            <option value="">Select Tournament Type</option>
            <option value="Solo">Solo</option>
            <option value="Duo">Duo</option>
            <option value="Squad">Squad</option>
        </select>

        <button onclick="createTournament()">
            Create Tournament
        </button>

    </div>


    <!-- PLAYER REGISTRATION -->
    <div class="card">

        <div class="title">👤 Player Registration</div>

        <input
            id="playerName"
            type="text"
            placeholder="Player Name"
        >

        <input
            id="gameUID"
            type="text"
            placeholder="Game UID"
        >

        <input
            id="mobileNumber"
            type="tel"
            placeholder="Mobile Number"
        >

        <button onclick="registerPlayer()">
            Register Player
        </button>

    </div>


    <!-- AVAILABLE TOURNAMENTS -->
    <div class="card">

        <div class="title">🎮 Available Tournaments</div>

        <div id="tournaments">
            <div class="loading">
                Loading tournaments...
            </div>
        </div>

    </div>


    <!-- REGISTERED PLAYERS -->
    <div class="card">

        <div class="title">👥 Registered Players</div>

        <div id="players">
            <div class="loading">
                Loading players...
            </div>
        </div>

    </div>

</div>

<footer>
    © 2026 BattleZone Tournament Platform
</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    getDoc,
    updateDoc,
    arrayUnion,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {
    apiKey: "AIzaSyD3wpFyGO0x1aCblzlDey_qtT_Jvu7ZscY",
    authDomain: "battlezone-ba07f.firebaseapp.com",
    projectId: "battlezone-ba07f",
    storageBucket: "battlezone-ba07f.firebasestorage.app",
    messagingSenderId: "193110804088",
    appId: "1:193110804088:web:6a1ddccc81cd785b1b4f8d"
};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =========================================
   MESSAGE FUNCTION
========================================= */

function showMessage(text,type){

    const message = document.getElementById("message");

    message.innerText = text;

    message.className = "message " + type;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

    setTimeout(()=>{
        message.style.display = "none";
    },4000);
}


/* =========================================
   CREATE TOURNAMENT
========================================= */

window.createTournament = async function(){

    const tournamentName =
        document.getElementById("tournamentName").value.trim();

    const gameName =
        document.getElementById("gameName").value.trim();

    const entryFee =
        document.getElementById("entryFee").value.trim();

    const prizePool =
        document.getElementById("prizePool").value.trim();

    const tournamentType =
        document.getElementById("tournamentType").value;


    if(
        !tournamentName ||
        !gameName ||
        !entryFee ||
        !prizePool ||
        !tournamentType
    ){

        showMessage(
            "❌ Please fill all tournament details.",
            "error"
        );

        return;
    }


    try{

        await addDoc(
            collection(db,"tournaments"),
            {

                tournamentName:tournamentName,

                gameName:gameName,

                entryFee:Number(entryFee),

                prizePool:Number(prizePool),

                tournamentType:tournamentType,

                players:[],

                createdAt:serverTimestamp()

            }
        );


        showMessage(
            "✅ Tournament successfully create ho gaya!",
            "success"
        );


        document.getElementById("tournamentName").value="";
        document.getElementById("gameName").value="";
        document.getElementById("entryFee").value="";
        document.getElementById("prizePool").value="";
        document.getElementById("tournamentType").value="";


        loadTournaments();

    }

    catch(error){

        console.error(error);

        showMessage(
            "❌ Error: " + error.message,
            "error"
        );

    }

};


/* =========================================
   REGISTER PLAYER
========================================= */

window.registerPlayer = async function(){

    const playerName =
        document.getElementById("playerName").value.trim();

    const gameUID =
        document.getElementById("gameUID").value.trim();

    const mobileNumber =
        document.getElementById("mobileNumber").value.trim();


    if(
        !playerName ||
        !gameUID ||
        !mobileNumber
    ){

        showMessage(
            "❌ Please fill all player details.",
            "error"
        );

        return;
    }


    try{

        await addDoc(
            collection(db,"players"),
            {

                playerName:playerName,

                gameUID:gameUID,

                mobileNumber:mobileNumber,

                registeredAt:serverTimestamp()

            }
        );


        showMessage(
            "✅ Player successfully register ho gaya!",
            "success"
        );


        document.getElementById("playerName").value="";
        document.getElementById("gameUID").value="";
        document.getElementById("mobileNumber").value="";


        loadPlayers();

    }

    catch(error){

        console.error(error);

        showMessage(
            "❌ Error: " + error.message,
            "error"
        );

    }

};


/* =========================================
   LOAD TOURNAMENTS
========================================= */

async function loadTournaments(){

    const container =
        document.getElementById("tournaments");

    container.innerHTML =
        '<div class="loading">Loading tournaments...</div>';


    try{

        const snapshot =
            await getDocs(
                collection(db,"tournaments")
            );


        if(snapshot.empty){

            container.innerHTML =
                '<div class="empty">No tournaments available.</div>';

            return;
        }


        container.innerHTML="";


        snapshot.forEach((item)=>{

            const data = item.data();

            const tournamentId = item.id;

            const players =
                Array.isArray(data.players)
                ? data.players
                : [];


            const div =
                document.createElement("div");

            div.className="tournament";


            div.innerHTML = `

                <span class="badge">
                    ${escapeHTML(data.tournamentType || "Tournament")}
                </span>

                <h3>
                    🏆 ${escapeHTML(data.tournamentName || "Tournament")}
                </h3>

                <div class="info">
                    🎮 Game:
                    <b>${escapeHTML(data.gameName || "-")}</b>
                </div>

                <div class="info">
                    💰 Entry:
                    <b>₹${data.entryFee ?? 0}</b>
                </div>

                <div class="info">
                    🏆 Prize:
                    <b>₹${data.prizePool ?? 0}</b>
                </div>

                <div class="info">
                    👥 Joined Players:
                    <b>${players.length}</b>
                </div>

                <button
                    class="small-btn"
                    onclick="joinTournament('${tournamentId}')"
                >
                    🎮 Join Tournament
                </button>

                <button
                    class="small-btn"
                    onclick="viewPlayers('${tournamentId}')"
                >
                    👥 View Joined Players
                </button>

                <div
                    id="joined-${tournamentId}"
                    style="display:none;margin-top:15px"
                ></div>

            `;


            container.appendChild(div);

        });

    }

    catch(error){

        console.error(error);

        container.innerHTML =
            '<div class="empty">Unable to load tournaments.</div>';

    }

}


/* =========================================
   JOIN TOURNAMENT
========================================= */

window.joinTournament = async function(tournamentId){

    const playerName =
        document.getElementById("playerName").value.trim();

    const gameUID =
        document.getElementById("gameUID").value.trim();

    const mobileNumber =
        document.getElementById("mobileNumber").value.trim();


    if(!playerName || !gameUID || !mobileNumber){

        showMessage(
            "❌ Pehle Player Registration me Name, Game UID aur Mobile Number bharo.",
            "error"
        );

        return;
    }


    try{

        const tournamentRef =
            doc(db,"tournaments",tournamentId);

        const tournamentSnap =
            await getDoc(tournamentRef);


        if(!tournamentSnap.exists()){

            showMessage(
                "❌ Tournament nahi mila.",
                "error"
            );

            return;
        }


        const tournamentData =
            tournamentSnap.data();


        let players =
            Array.isArray(tournamentData.players)
            ? tournamentData.players
            : [];


        /* DUPLICATE CHECK */

        const alreadyJoined =
            players.some(
                player =>
                    player.gameUID === gameUID
            );


        if(alreadyJoined){

            showMessage(
                "⚠️ Ye Game UID already tournament me joined hai.",
                "error"
            );

            return;
        }


        const newPlayer = {

            playerName:playerName,

            gameUID:gameUID,

            mobileNumber:mobileNumber,

            joinedAt:new Date().toISOString()

        };


        await updateDoc(
            tournamentRef,
            {
                players:arrayUnion(newPlayer)
            }
        );


        showMessage(
            "✅ Tournament successfully join ho gaya!",
            "success"
        );


        loadTournaments();

    }

    catch(error){

        console.error(error);

        showMessage(
            "❌ Join Error: " + error.message,
            "error"
        );

    }

};


/* =========================================
   VIEW JOINED PLAYERS
========================================= */

window.viewPlayers = async function(tournamentId){

    const box =
        document.getElementById(
            "joined-" + tournamentId
        );


    if(box.style.display === "block"){

        box.style.display="none";

        return;
    }


    box.style.display="block";

    box.innerHTML =
        '<div class="loading">Loading players...</div>';


    try{

        const tournamentRef =
            doc(db,"tournaments",tournamentId);

        const snapshot =
            await getDoc(tournamentRef);


        if(!snapshot.exists()){

            box.innerHTML =
                '<div class="empty">Tournament not found.</div>';

            return;
        }


        const data =
            snapshot.data();


        const players =
            Array.isArray(data.players)
            ? data.players
            : [];


        if(players.length === 0){

            box.innerHTML =
                '<div class="empty">Abhi koi player joined nahi hai.</div>';

            return;
        }


        box.innerHTML="";


        players.forEach((player,index)=>{

            const div =
                document.createElement("div");

            div.className="player";


            div.innerHTML = `

                <div class="player-name">
                    👤 #${index + 1}
                    ${escapeHTML(player.playerName || "-")}
                </div>

                <div>
                    🎮 Game UID:
                    ${escapeHTML(player.gameUID || "-")}
                </div>

                <div>
                    📱 Mobile:
                    ${escapeHTML(player.mobileNumber || "-")}
                </div>

            `;


            box.appendChild(div);

        });

    }

    catch(error){

        console.error(error);

        box.innerHTML =
            '<div class="empty">Unable to load players.</div>';

    }

};


/* =========================================
   LOAD ALL REGISTERED PLAYERS
========================================= */

async function loadPlayers(){

    const container =
        document.getElementById("players");

    container.innerHTML =
        '<div class="loading">Loading players...</div>';


    try{

        const snapshot =
            await getDocs(
                collection(db,"players")
            );


        if(snapshot.empty){

            container.innerHTML =
                '<div class="empty">No registered players.</div>';

            return;
        }


        container.innerHTML="";


        snapshot.forEach((item)=>{

            const data =
                item.data();


            const div =
                document.createElement("div");

            div.className="player";


            div.innerHTML = `

                <div class="player-name">
                    👤 ${escapeHTML(data.playerName || "-")}
                </div>

                <div>
                    🎮 Game UID:
                    ${escapeHTML(data.gameUID || "-")}
                </div>

                <div>
                    📱 Mobile:
                    ${escapeHTML(data.mobileNumber || "-")}
                </div>

            `;


            container.appendChild(div);

        });

    }

    catch(error){

        console.error(error);

        container.innerHTML =
            '<div class="empty">Unable to load players.</div>';

    }

}


/* =========================================
   SECURITY: ESCAPE HTML
========================================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================
   START APP
========================================= */

loadTournaments();

loadPlayers();

</script>

</body>
  </html>
