<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BattleZone Tournament</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#08080c;
  color:white;
}

header{
  text-align:center;
  padding:30px 15px;
  background:linear-gradient(135deg,#ff9800,#ff2d00);
}

header h1{
  margin:0;
  font-size:42px;
  font-weight:800;
}

header p{
  margin:10px 0 0;
  font-size:20px;
}

.container{
  width:95%;
  max-width:700px;
  margin:25px auto;
}

.card{
  background:#17171d;
  border:1px solid #303039;
  border-radius:25px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.card h2{
  margin-top:0;
  color:#ff9800;
  font-size:30px;
}

input,
select{
  width:100%;
  padding:18px;
  margin:10px 0;
  border-radius:16px;
  border:1px solid #38383f;
  background:#0d0d11;
  color:white;
  font-size:18px;
  outline:none;
}

input:focus,
select:focus{
  border-color:#ff9800;
}

select option{
  background:#17171d;
  color:white;
}

button{
  width:100%;
  padding:18px;
  margin-top:12px;
  border:0;
  border-radius:16px;
  background:linear-gradient(135deg,#ff9800,#ff2d00);
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.message{
  display:none;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
  text-align:center;
  font-weight:bold;
}

.success{
  background:#123d20;
  color:#54ff88;
  border:1px solid #278b46;
}

.error{
  background:#421515;
  color:#ff7777;
  border:1px solid #a33;
}

.tournament{
  background:#0e0e13;
  border:1px solid #36363f;
  border-radius:20px;
  padding:20px;
  margin-top:15px;
}

.tournament h3{
  color:#ff9800;
  font-size:24px;
  margin:10px 0 15px;
}

.badge{
  display:inline-block;
  background:#3d3000;
  color:#ffc107;
  padding:8px 14px;
  border-radius:20px;
  font-size:14px;
  font-weight:bold;
}

.info{
  background:#1b1b23;
  border-radius:14px;
  padding:13px;
  margin:8px 0;
  font-size:17px;
}

.player{
  background:#0e0e13;
  border:1px solid #36363f;
  border-radius:20px;
  padding:20px;
  margin-top:15px;
}

.player h3{
  margin:0 0 10px;
  font-size:22px;
}

.player p{
  margin:8px 0;
  color:#ddd;
  font-size:16px;
}

.empty{
  text-align:center;
  color:#999;
  padding:20px;
}

footer{
  text-align:center;
  color:#777;
  padding:30px 10px;
  font-size:15px;
}

.small{
  color:#999;
  font-size:14px;
  margin-top:5px;
}

.loading{
  text-align:center;
  color:#aaa;
  padding:15px;
}

@media(max-width:500px){

  header h1{
    font-size:34px;
  }

  header p{
    font-size:17px;
  }

  .card{
    padding:20px;
    border-radius:20px;
  }

  .card h2{
    font-size:27px;
  }

  input,
  select{
    font-size:16px;
    padding:16px;
  }

  button{
    font-size:18px;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚔️ BattleZone</h1>
  <p>Ultimate Tournament Platform</p>
</header>

<div class="container">

  <!-- CREATE TOURNAMENT -->
  <div class="card">

    <h2>🏆 Create Tournament</h2>

    <input
      type="text"
      id="tournamentName"
      placeholder="Tournament Name"
    >

    <input
      type="text"
      id="gameName"
      placeholder="Game Name"
    >

    <input
      type="number"
      id="entryFee"
      placeholder="Entry Fee"
      min="0"
    >

    <input
      type="number"
      id="prizePool"
      placeholder="Prize Pool"
      min="0"
    >

    <select id="tournamentType">
      <option value="">Select Tournament Type</option>
      <option value="Solo">Solo</option>
      <option value="Duo">Duo</option>
      <option value="Squad">Squad</option>
    </select>

    <button onclick="createTournament()">
      Create Tournament
    </button>

    <div id="tournamentMessage" class="message"></div>

  </div>


  <!-- PLAYER REGISTRATION -->
  <div class="card">

    <h2>👤 Player Registration</h2>

    <input
      type="text"
      id="playerName"
      placeholder="Player Name"
    >

    <input
      type="text"
      id="gameUID"
      placeholder="Game UID"
    >

    <input
      type="tel"
      id="mobileNumber"
      placeholder="Mobile Number"
      maxlength="10"
    >

    <select id="playerTournament">
      <option value="">Select Tournament</option>
    </select>

    <button onclick="registerPlayer()">
      Register Player
    </button>

    <div id="playerMessage" class="message"></div>

  </div>


  <!-- AVAILABLE TOURNAMENTS -->
  <div class="card">

    <h2>🎮 Available Tournaments</h2>

    <div id="tournamentList" class="loading">
      Loading tournaments...
    </div>

  </div>


  <!-- REGISTERED PLAYERS -->
  <div class="card">

    <h2>👥 Registered Players</h2>

    <div id="playerList" class="loading">
      Loading players...
    </div>

  </div>

</div>


<footer>
  © 2026 BattleZone Tournament Platform
</footer>


<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {
  apiKey: "AIzaSyD3wpFyGO0x1aCblzlDey_qtT_Jvu7ZscY",
  authDomain: "battlezone-ba07f.firebaseapp.com",
  projectId: "battlezone-ba07f",
  storageBucket: "battlezone-ba07f.firebasestorage.app",
  messagingSenderId: "193110804088",
  appId: "1:193110804088:web:6a1ddccc81cd785b1b4f8d"
};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


/* =========================================
   MESSAGE FUNCTION
========================================= */

function showMessage(elementId, text, type){

  const element = document.getElementById(elementId);

  element.innerText = text;

  element.className = "message " + type;

  element.style.display = "block";

  setTimeout(function(){

    element.style.display = "none";

  },5000);
}


/* =========================================
   CREATE TOURNAMENT
========================================= */

async function createTournament(){

  const tournamentName =
    document.getElementById("tournamentName").value.trim();

  const gameName =
    document.getElementById("gameName").value.trim();

  const entryFee =
    document.getElementById("entryFee").value.trim();

  const prizePool =
    document.getElementById("prizePool").value.trim();

  const tournamentType =
    document.getElementById("tournamentType").value;


  /* VALIDATION */

  if(!tournamentName){

    showMessage(
      "tournamentMessage",
      "❌ Tournament Name enter karo!",
      "error"
    );

    return;
  }


  if(!gameName){

    showMessage(
      "tournamentMessage",
      "❌ Game Name enter karo!",
      "error"
    );

    return;
  }


  if(entryFee === ""){

    showMessage(
      "tournamentMessage",
      "❌ Entry Fee enter karo!",
      "error"
    );

    return;
  }


  if(prizePool === ""){

    showMessage(
      "tournamentMessage",
      "❌ Prize Pool enter karo!",
      "error"
    );

    return;
  }


  if(!tournamentType){

    showMessage(
      "tournamentMessage",
      "❌ Tournament Type select karo!",
      "error"
    );

    return;
  }


  try{

    await db.collection("tournaments").add({

      tournamentName: tournamentName,

      gameName: gameName,

      entryFee: Number(entryFee),

      prizePool: Number(prizePool),

      tournamentType: tournamentType,

      createdAt: firebase.firestore.FieldValue.serverTimestamp()

    });


    showMessage(
      "tournamentMessage",
      "✅ Tournament successfully create ho gaya!",
      "success"
    );


    /* CLEAR FORM */

    document.getElementById("tournamentName").value = "";

    document.getElementById("gameName").value = "";

    document.getElementById("entryFee").value = "";

    document.getElementById("prizePool").value = "";

    document.getElementById("tournamentType").value = "";

  }

  catch(error){

    console.error(error);

    showMessage(
      "tournamentMessage",
      "❌ Error: " + error.message,
      "error"
    );

  }

}


/* =========================================
   REGISTER PLAYER
========================================= */

async function registerPlayer(){

  const playerName =
    document.getElementById("playerName").value.trim();

  const gameUID =
    document.getElementById("gameUID").value.trim();

  const mobileNumber =
    document.getElementById("mobileNumber").value.trim();

  const tournamentId =
    document.getElementById("playerTournament").value;


  /* VALIDATION */

  if(!playerName){

    showMessage(
      "playerMessage",
      "❌ Player Name enter karo!",
      "error"
    );

    return;
  }


  if(!gameUID){

    showMessage(
      "playerMessage",
      "❌ Game UID enter karo!",
      "error"
    );

    return;
  }


  if(!mobileNumber){

    showMessage(
      "playerMessage",
      "❌ Mobile Number enter karo!",
      "error"
    );

    return;
  }


  if(!/^[0-9]{10}$/.test(mobileNumber)){

    showMessage(
      "playerMessage",
      "❌ 10 digit mobile number enter karo!",
      "error"
    );

    return;
  }


  if(!tournamentId){

    showMessage(
      "playerMessage",
      "❌ Tournament select karo!",
      "error"
    );

    return;
  }


  try{

    /* GET TOURNAMENT */

    const tournamentDoc =
      await db.collection("tournaments")
      .doc(tournamentId)
      .get();


    if(!tournamentDoc.exists){

      showMessage(
        "playerMessage",
        "❌ Tournament nahi mila!",
        "error"
      );

      return;
    }


    const tournament =
      tournamentDoc.data();


    /* SAVE PLAYER */

    await db.collection("players").add({

      playerName: playerName,

      gameUID: gameUID,

      mobileNumber: mobileNumber,

      tournamentId: tournamentId,

      tournamentName:
        tournament.tournamentName || "",

      gameName:
        tournament.gameName || "",

      registeredAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });


    showMessage(
      "playerMessage",
      "✅ Player successfully register ho gaya!",
      "success"
    );


    /* CLEAR FORM */

    document.getElementById("playerName").value = "";

    document.getElementById("gameUID").value = "";

    document.getElementById("mobileNumber").value = "";

    document.getElementById("playerTournament").value = "";

  }

  catch(error){

    console.error(error);

    showMessage(
      "playerMessage",
      "❌ Error: " + error.message,
      "error"
    );

  }

}


/* =========================================
   LOAD TOURNAMENTS
========================================= */

function loadTournaments(){

  db.collection("tournaments")
    .orderBy("createdAt","desc")
    .onSnapshot(

      function(snapshot){

        const list =
          document.getElementById("tournamentList");

        const select =
          document.getElementById("playerTournament");


        list.innerHTML = "";

        select.innerHTML =
          '<option value="">Select Tournament</option>';


        if(snapshot.empty){

          list.innerHTML =
            '<div class="empty">No tournaments available.</div>';

          return;
        }


        snapshot.forEach(function(doc){

          const data = doc.data();


          /* TOURNAMENT CARD */

          const card =
            document.createElement("div");

          card.className = "tournament";


          card.innerHTML = `

            <span class="badge">
              ${escapeHTML(data.tournamentType || "Tournament")}
            </span>

            <h3>
              🏆 ${escapeHTML(data.tournamentName || "Tournament")}
            </h3>

            <div class="info">
              🎮 Game:
              <b>${escapeHTML(data.gameName || "-")}</b>
            </div>

            <div class="info">
              💰 Entry:
              <b>₹${data.entryFee ?? 0}</b>
            </div>

            <div class="info">
              🏆 Prize:
              <b>₹${data.prizePool ?? 0}</b>
            </div>

            <div class="info">
              👥 Type:
              <b>${escapeHTML(data.tournamentType || "-")}</b>
            </div>

          `;


          list.appendChild(card);


          /* DROPDOWN OPTION */

          const option =
            document.createElement("option");

          option.value = doc.id;

          option.textContent =
            `${data.tournamentName || "Tournament"} - ${data.gameName || ""}`;


          select.appendChild(option);

        });

      },

      function(error){

        console.error(error);

        document.getElementById("tournamentList").innerHTML =
          '<div class="empty">❌ Tournament load nahi ho pa raha.</div>';

      }

    );

}


/* =========================================
   LOAD PLAYERS
========================================= */

function loadPlayers(){

  db.collection("players")
    .orderBy("registeredAt","desc")
    .onSnapshot(

      function(snapshot){

        const list =
          document.getElementById("playerList");


        list.innerHTML = "";


        if(snapshot.empty){

          list.innerHTML =
            '<div class="empty">No players registered.</div>';

          return;
        }


        snapshot.forEach(function(doc){

          const data =
            doc.data();


          const card =
            document.createElement("div");

          card.className = "player";


          card.innerHTML = `

            <h3>
              👤 ${escapeHTML(data.playerName || "Player")}
            </h3>

            <p>
              🎮 Game UID:
              <b>${escapeHTML(data.gameUID || "-")}</b>
            </p>

            <p>
              🏆 Tournament:
              <b>${escapeHTML(data.tournamentName || "-")}</b>
            </p>

            <p>
              🎮 Game:
              <b>${escapeHTML(data.gameName || "-")}</b>
            </p>

            <p>
              📱 Mobile:
              <b>${escapeHTML(data.mobileNumber || "-")}</b>
            </p>

          `;


          list.appendChild(card);

        });

      },

      function(error){

        console.error(error);

        document.getElementById("playerList").innerHTML =
          '<div class="empty">❌ Players load nahi ho rahe.</div>';

      }

    );

}


/* =========================================
   SECURITY HELPER
========================================= */

function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    String(value);

  return div.innerHTML;

}


/* =========================================
   START
========================================= */

loadTournaments();

loadPlayers();

</script>

</body>
</html>
