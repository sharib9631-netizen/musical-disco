<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BattleZone Tournament</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #0b0b0f;
      color: white;
    }

    header {
      text-align: center;
      padding: 25px 15px;
      background: linear-gradient(135deg, #ff9800, #ff2600);
    }

    header h1 {
      margin: 0;
      font-size: 42px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px;
    }

    .card {
      background: #17171d;
      border: 1px solid #303039;
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 25px;
    }

    h2 {
      color: #ff9800;
      margin-top: 0;
    }

    input, select {
      width: 100%;
      padding: 18px;
      margin: 10px 0;
      background: #0d0d11;
      color: white;
      border: 1px solid #36363d;
      border-radius: 15px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 12px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(135deg, #ff9800, #ff3300);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #message {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
    }

    .success {
      color: #00e676;
    }

    .error {
      color: #ff5252;
    }
  </style>
</head>

<body>

<header>
  <h1>⚔️ BattleZone</h1>
  <p>Ultimate Tournament Platform</p>
</header>

<div class="container">

  <!-- CREATE TOURNAMENT -->
  <div class="card">
    <h2>🏆 Create Tournament</h2>

    <input id="tournamentName" type="text"
      placeholder="Tournament Name">

    <input id="gameName" type="text"
      placeholder="Game Name">

    <input id="entryFee" type="number"
      placeholder="Entry Fee">

    <input id="prizePool" type="number"
      placeholder="Prize Pool">

    <select id="tournamentType">
      <option value="">Select Tournament Type</option>
      <option value="Solo">Solo</option>
      <option value="Duo">Duo</option>
      <option value="Squad">Squad</option>
    </select>

    <button onclick="createTournament()">
      Create Tournament
    </button>
  </div>


  <!-- PLAYER REGISTRATION -->
  <div class="card">
    <h2>👤 Player Registration</h2>

    <input id="playerName" type="text"
      placeholder="Player Name">

    <input id="gameUID" type="text"
      placeholder="Game UID">

    <input id="mobileNumber" type="tel"
      placeholder="Mobile Number">

    <button onclick="registerPlayer()">
      Register Player
    </button>
  </div>

  <div id="message"></div>

</div>


<!-- FIREBASE -->
<script type="module">

  import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
  }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  // YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyD3wpFyGO0x1aCblzlDey_qtT_Jvu7ZscY",
    authDomain: "battlezone-ba07f.firebaseapp.com",
    projectId: "battlezone-ba07f",
    storageBucket: "battlezone-ba07f.firebasestorage.app",
    messagingSenderId: "193110804088",
    appId: "1:193110804088:web:6a1ddccc81cd785b1b4f8d"
  };


  // Firebase start
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);


  // MESSAGE
  function showMessage(text, type) {
    const message = document.getElementById("message");

    message.innerText = text;
    message.className = type;

    setTimeout(() => {
      message.innerText = "";
      message.className = "";
    }, 4000);
  }


  // CREATE TOURNAMENT
  window.createTournament = async function() {

    const tournamentName =
      document.getElementById("tournamentName").value.trim();

    const gameName =
      document.getElementById("gameName").value.trim();

    const entryFee =
      document.getElementById("entryFee").value;

    const prizePool =
      document.getElementById("prizePool").value;

    const tournamentType =
      document.getElementById("tournamentType").value;


    if (
      !tournamentName ||
      !gameName ||
      !entryFee ||
      !prizePool ||
      !tournamentType
    ) {
      showMessage("❌ Sabhi details fill karo", "error");
      return;
    }


    try {

      await addDoc(collection(db, "tournaments"), {

        tournamentName: tournamentName,
        gameName: gameName,
        entryFee: Number(entryFee),
        prizePool: Number(prizePool),
        tournamentType: tournamentType,

        createdAt: serverTimestamp()

      });


      showMessage(
        "✅ Tournament successfully create ho gaya!",
        "success"
      );


      document.getElementById("tournamentName").value = "";
      document.getElementById("gameName").value = "";
      document.getElementById("entryFee").value = "";
      document.getElementById("prizePool").value = "";
      document.getElementById("tournamentType").value = "";

    } catch (error) {

      console.error(error);

      showMessage(
        "❌ Error: " + error.message,
        "error"
      );

    }
  };


  // PLAYER REGISTRATION
  window.registerPlayer = async function() {

    const playerName =
      document.getElementById("playerName").value.trim();

    const gameUID =
      document.getElementById("gameUID").value.trim();

    const mobileNumber =
      document.getElementById("mobileNumber").value.trim();


    if (!playerName || !gameUID || !mobileNumber) {

      showMessage(
        "❌ Sabhi player details fill karo",
        "error"
      );

      return;
    }


    try {

      await addDoc(collection(db, "players"), {

        playerName: playerName,
        gameUID: gameUID,
        mobileNumber: mobileNumber,

        registeredAt: serverTimestamp()

      });


      showMessage(
        "✅ Player successfully register ho gaya!",
        "success"
      );


      document.getElementById("playerName").value = "";
      document.getElementById("gameUID").value = "";
      document.getElementById("mobileNumber").value = "";


    } catch (error) {

      console.error(error);

      showMessage(
        "❌ Error: " + error.message,
        "error"
      );

    }

  };

</script>

</body>
</html>
