<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BattleZone Tournament</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #08080d;
      color: white;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #ff9800, #ff2600);
      text-align: center;
      padding: 28px 15px;
      box-shadow: 0 5px 20px rgba(255, 80, 0, 0.25);
    }

    header h1 {
      font-size: 42px;
      font-weight: 800;
    }

    header p {
      margin-top: 8px;
      font-size: 20px;
    }

    .container {
      width: 95%;
      max-width: 900px;
      margin: 25px auto;
    }

    .card {
      background: #15151c;
      border: 1px solid #30303a;
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .card h2 {
      color: #ff9d00;
      margin-bottom: 20px;
      font-size: 28px;
    }

    input,
    select {
      width: 100%;
      padding: 17px;
      margin-bottom: 15px;
      border-radius: 15px;
      border: 1px solid #393943;
      background: #0d0d12;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #ff9800;
    }

    select option {
      background: #111118;
      color: white;
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(135deg, #ffad00, #ff3200);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.01);
    }

    button:active {
      transform: scale(0.98);
    }

    .message {
      display: none;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-weight: bold;
      text-align: center;
    }

    .success {
      display: block;
      background: #123d24;
      color: #61ff9b;
      border: 1px solid #216c3e;
    }

    .error {
      display: block;
      background: #431818;
      color: #ff7777;
      border: 1px solid #7b2929;
    }

    .tournament {
      background: #0e0e14;
      border: 1px solid #30303b;
      border-radius: 17px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .tournament h3 {
      color: #ff9d00;
      font-size: 21px;
      margin-bottom: 12px;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .info div {
      background: #181820;
      padding: 10px;
      border-radius: 10px;
      color: #ddd;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      background: #29200c;
      color: #ffb300;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .player {
      background: #0e0e14;
      border: 1px solid #30303b;
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .player h3 {
      color: #fff;
      margin-bottom: 8px;
    }

    .player p {
      color: #bbb;
      font-size: 14px;
      margin-top: 5px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 20px;
    }

    .loading {
      text-align: center;
      color: #ffad00;
      padding: 15px;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 30px 15px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 34px;
      }

      header p {
        font-size: 17px;
      }

      .card {
        padding: 18px;
      }

      .card h2 {
        font-size: 24px;
      }

      .info {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>⚔️ BattleZone</h1>
    <p>Ultimate Tournament Platform</p>
  </header>

  <div class="container">

    <!-- MESSAGE -->
    <div id="message" class="message"></div>

    <!-- CREATE TOURNAMENT -->
    <div class="card">

      <h2>🏆 Create Tournament</h2>

      <input
        type="text"
        id="tournamentName"
        placeholder="Tournament Name"
      >

      <input
        type="text"
        id="gameName"
        placeholder="Game Name"
      >

      <input
        type="number"
        id="entryFee"
        placeholder="Entry Fee"
        min="0"
      >

      <input
        type="number"
        id="prizePool"
        placeholder="Prize Pool"
        min="0"
      >

      <select id="tournamentType">
        <option value="">Select Tournament Type</option>
        <option value="Solo">Solo</option>
        <option value="Duo">Duo</option>
        <option value="Squad">Squad</option>
        <option value="1v1">1 vs 1</option>
        <option value="2v2">2 vs 2</option>
        <option value="4v4">4 vs 4</option>
      </select>

      <button onclick="createTournament()">
        Create Tournament
      </button>

    </div>


    <!-- PLAYER REGISTRATION -->
    <div class="card">

      <h2>👤 Player Registration</h2>

      <select id="playerTournament">
        <option value="">Select Tournament</option>
      </select>

      <input
        type="text"
        id="playerName"
        placeholder="Player Name"
      >

      <input
        type="text"
        id="gameUID"
        placeholder="Game UID"
      >

      <input
        type="tel"
        id="mobileNumber"
        placeholder="Mobile Number"
        maxlength="10"
      >

      <button onclick="registerPlayer()">
        Register Player
      </button>

    </div>


    <!-- TOURNAMENTS -->
    <div class="card">

      <h2>🎮 Available Tournaments</h2>

      <div id="tournamentList">
        <div class="loading">
          Loading tournaments...
        </div>
      </div>

    </div>


    <!-- PLAYERS -->
    <div class="card">

      <h2>👥 Registered Players</h2>

      <div id="playerList">
        <div class="loading">
          Loading players...
        </div>
      </div>

    </div>

  </div>


  <footer>
    © 2026 BattleZone Tournament Platform
  </footer>


  <script>

    // =========================================================
    // FIREBASE CONFIG
    // =========================================================

    const firebaseConfig = {
      apiKey: "AIzaSyD3wpFyGO0x1aCblzlDey_qtT_Jvu7ZscY",
      authDomain: "battlezone-ba07f.firebaseapp.com",
      projectId: "battlezone-ba07f",
      storageBucket: "battlezone-ba07f.firebasestorage.app",
      messagingSenderId: "193110804088",
      appId: "1:193110804088:web:6a1ddccc81cd785b1b4f8d"
    };


    // =========================================================
    // FIREBASE INITIALIZE
    // =========================================================

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();


    // =========================================================
    // MESSAGE FUNCTION
    // =========================================================

    function showMessage(text, type) {

      const message = document.getElementById("message");

      message.innerText = text;

      message.className = "message " + type;

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

      setTimeout(function() {
        message.className = "message";
      }, 4000);
    }


    // =========================================================
    // CREATE TOURNAMENT
    // =========================================================

    async function createTournament() {

      const tournamentName =
        document.getElementById("tournamentName").value.trim();

      const gameName =
        document.getElementById("gameName").value.trim();

      const entryFee =
        document.getElementById("entryFee").value.trim();

      const prizePool =
        document.getElementById("prizePool").value.trim();

      const tournamentType =
        document.getElementById("tournamentType").value;


      // VALIDATION

      if (!tournamentName) {
        showMessage("❌ Tournament Name enter karo.", "error");
        return;
      }

      if (!gameName) {
        showMessage("❌ Game Name enter karo.", "error");
        return;
      }

      if (entryFee === "") {
        showMessage("❌ Entry Fee enter karo.", "error");
        return;
      }

      if (prizePool === "") {
        showMessage("❌ Prize Pool enter karo.", "error");
        return;
      }

      if (!tournamentType) {
        showMessage("❌ Tournament Type select karo.", "error");
        return;
      }


      try {

        await db.collection("tournaments").add({

          tournamentName: tournamentName,

          gameName: gameName,

          entryFee: Number(entryFee),

          prizePool: Number(prizePool),

          tournamentType: tournamentType,

          createdAt:
            firebase.firestore.FieldValue.serverTimestamp()

        });


        showMessage(
          "✅ Tournament successfully create ho gaya!",
          "success"
        );


        // CLEAR FORM

        document.getElementById("tournamentName").value = "";

        document.getElementById("gameName").value = "";

        document.getElementById("entryFee").value = "";

        document.getElementById("prizePool").value = "";

        document.getElementById("tournamentType").value = "";


      } catch (error) {

        console.error(error);

        showMessage(
          "❌ Error: " + error.message,
          "error"
        );

      }

    }


    // =========================================================
    // REGISTER PLAYER
    // =========================================================

    async function registerPlayer() {

      const tournamentId =
        document.getElementById("playerTournament").value;

      const tournamentSelect =
        document.getElementById("playerTournament");

      const selectedOption =
        tournamentSelect.options[tournamentSelect.selectedIndex];


      const playerName =
        document.getElementById("playerName").value.trim();

      const gameUID =
        document.getElementById("gameUID").value.trim();

      const mobileNumber =
        document.getElementById("mobileNumber").value.trim();


      // VALIDATION

      if (!tournamentId) {
        showMessage(
          "❌ Pehle tournament select karo.",
          "error"
        );
        return;
      }

      if (!playerName) {
        showMessage(
          "❌ Player Name enter karo.",
          "error"
        );
        return;
      }

      if (!gameUID) {
        showMessage(
          "❌ Game UID enter karo.",
          "error"
        );
        return;
      }

      if (!mobileNumber) {
        showMessage(
          "❌ Mobile Number enter karo.",
          "error"
        );
        return;
      }

      if (!/^[0-9]{10}$/.test(mobileNumber)) {
        showMessage(
          "❌ 10 digit mobile number enter karo.",
          "error"
        );
        return;
      }


      try {

        await db.collection("players").add({

          tournamentId: tournamentId,

          tournamentName:
            selectedOption.dataset.name || selectedOption.text,

          playerName: playerName,

          gameUID: gameUID,

          mobileNumber: mobileNumber,

          registeredAt:
            firebase.firestore.FieldValue.serverTimestamp()

        });


        showMessage(
          "✅ Player successfully register ho gaya!",
          "success"
        );


        // CLEAR FORM

        document.getElementById("playerName").value = "";

        document.getElementById("gameUID").value = "";

        document.getElementById("mobileNumber").value = "";


      } catch (error) {

        console.error(error);

        showMessage(
          "❌ Error: " + error.message,
          "error"
        );

      }

    }


    // =========================================================
    // LOAD TOURNAMENTS
    // =========================================================

    function loadTournaments() {

      db.collection("tournaments")
        .orderBy("createdAt", "desc")
        .onSnapshot(

          function(snapshot) {

            const list =
              document.getElementById("tournamentList");

            const select =
              document.getElementById("playerTournament");


            list.innerHTML = "";

            select.innerHTML =
              '<option value="">Select Tournament</option>';


            if (snapshot.empty) {

              list.innerHTML =
                '<div class="empty">No tournaments available.</div>';

              return;
            }


            snapshot.forEach(function(doc) {

              const data = doc.data();


              // -----------------------------
              // TOURNAMENT CARD
              // -----------------------------

              const div =
                document.createElement("div");

              div.className = "tournament";


              div.innerHTML = `

                <span class="badge">
                  ${escapeHTML(data.tournamentType || "Tournament")}
                </span>

                <h3>
                  🏆 ${escapeHTML(data.tournamentName || "Unnamed Tournament")}
                </h3>

                <div class="info">

                  <div>
                    🎮 Game:
                    <strong>
                      ${escapeHTML(data.gameName || "-")}
                    </strong>
                  </div>

                  <div>
                    💰 Entry:
                    <strong>
                      ₹${Number(data.entryFee || 0)}
                    </strong>
                  </div>

                  <div>
                    🏆 Prize:
                    <strong>
                      ₹${Number(data.prizePool || 0)}
                    </strong>
                  </div>

                  <div>
                    👥 Type:
                    <strong>
                      ${escapeHTML(data.tournamentType || "-")}
                    </strong>
                  </div>

                </div>

              `;


              list.appendChild(div);


              // -----------------------------
              // SELECT OPTION
              // -----------------------------

              const option =
                document.createElement("option");

              option.value = doc.id;

              option.text =
                data.tournamentName +
                " - " +
                data.gameName;

              option.dataset.name =
                data.tournamentName;


              select.appendChild(option);

            });

          },

          function(error) {

            console.error(error);

            document.getElementById("tournamentList").innerHTML =
              '<div class="empty">Tournament load nahi ho pa rahe.</div>';

            showMessage(
              "❌ Tournament loading error: " +
              error.message,
              "error"
            );

          }

        );

    }


    // =========================================================
    // LOAD PLAYERS
    // =========================================================

    function loadPlayers() {

      db.collection("players")
        .orderBy("registeredAt", "desc")
        .onSnapshot(

          function(snapshot) {

            const list =
              document.getElementById("playerList");

            list.innerHTML = "";


            if (snapshot.empty) {

              list.innerHTML =
                '<div class="empty">Abhi koi player registered nahi hai.</div>';

              return;
            }


            snapshot.forEach(function(doc) {

              const data = doc.data();


              const div =
                document.createElement("div");

              div.className = "player";


              div.innerHTML = `

                <h3>
                  👤 ${escapeHTML(data.playerName || "Player")}
                </h3>

                <p>
                  🎮 Game UID:
                  <strong>
                    ${escapeHTML(data.gameUID || "-")}
                  </strong>
                </p>

                <p>
                  🏆 Tournament:
                  <strong>
                    ${escapeHTML(data.tournamentName || "-")}
                  </strong>
                </p>

                <p>
                  📱 Mobile:
                  <strong>
                    ${escapeHTML(data.mobileNumber || "-")}
                  </strong>
                </p>

              `;


              list.appendChild(div);

            });

          },

          function(error) {

            console.error(error);

            document.getElementById("playerList").innerHTML =
              '<div class="empty">Players load nahi ho pa rahe.</div>';

          }

        );

    }


    // =========================================================
    // SECURITY HELPER
    // =========================================================

    function escapeHTML(value) {

      const div =
        document.createElement("div");

      div.textContent = value;

      return div.innerHTML;

    }


    // =========================================================
    // START APP
    // =========================================================

    loadTournaments();

    loadPlayers();

  </script>

</body>
  </html>
