<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BattleZone Tournament</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #0b0b0f;
      color: white;
    }

    header {
      background: linear-gradient(135deg, #ff8a00, #ff2600);
      padding: 25px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.9;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: #17171d;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 18px;
      border: 1px solid #292932;
    }

    h2 {
      margin-top: 0;
      color: #ff9d00;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border-radius: 10px;
      border: 1px solid #333;
      background: #0f0f13;
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff9d00, #ff3d00);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .tournament {
      background: #101015;
      border: 1px solid #30303a;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
    }

    .tournament h3 {
      margin: 0 0 10px;
      color: #fff;
    }

    .info {
      color: #bbb;
      line-height: 1.7;
    }

    .success {
      color: #39ff88;
      margin-top: 10px;
    }

    .error {
      color: #ff5555;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 25px;
    }
  </style>
</head>

<body>

<header>
  <h1>⚔️ BattleZone</h1>
  <p>Ultimate Tournament Platform</p>
</header>

<div class="container">

  <!-- CREATE TOURNAMENT -->
  <div class="card">
    <h2>🏆 Create Tournament</h2>

    <input id="tournamentName" placeholder="Tournament Name">

    <input id="gameName" placeholder="Game Name">

    <input id="entryFee" type="number" placeholder="Entry Fee">

    <input id="prize" placeholder="Prize Pool">

    <input id="tournamentDate" type="date">

    <button onclick="createTournament()">
      Create Tournament
    </button>

    <div id="createMessage"></div>
  </div>


  <!-- REGISTER PLAYER -->
  <div class="card">
    <h2>👤 Player Registration</h2>

    <input id="playerName" placeholder="Player Name">

    <input id="playerUid" placeholder="Game UID">

    <input id="playerPhone" placeholder="Mobile Number">

    <button onclick="registerPlayer()">
      Register Player
    </button>

    <div id="playerMessage"></div>
  </div>


  <!-- TOURNAMENT LIST -->
  <div class="card">
    <h2>🔥 Available Tournaments</h2>

    <div id="tournamentList">
      Loading tournaments...
    </div>
  </div>

</div>

<footer>
  © 2026 BattleZone
</footer>


<!-- FIREBASE -->
<script type="module">

  import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    serverTimestamp
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  // YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyD3wpFyGO0x1aCblzlDey_qtT_Jvu7ZscY",
    authDomain: "battlezone-ba07f.firebaseapp.com",
    projectId: "battlezone-ba07f",
    storageBucket: "battlezone-ba07f.firebasestorage.app",
    messagingSenderId: "193110804088",
    appId: "1:193110804088:web:6a1ddccc81cd785b1b4f8d"
  };


  // INITIALIZE FIREBASE
  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  // CREATE TOURNAMENT
  window.createTournament = async function () {

    const name =
      document.getElementById("tournamentName").value.trim();

    const game =
      document.getElementById("gameName").value.trim();

    const fee =
      document.getElementById("entryFee").value.trim();

    const prize =
      document.getElementById("prize").value.trim();

    const date =
      document.getElementById("tournamentDate").value.trim();

    const message =
      document.getElementById("createMessage");


    if (!name || !game || !fee || !prize || !date) {
      message.innerHTML =
        '<div class="error">⚠️ Sabhi fields fill karo.</div>';
      return;
    }


    try {

      await addDoc(collection(db, "tournaments"), {

        name: name,

        game: game,

        entryFee: fee,

        prize: prize,

        date: date,

        createdAt: serverTimestamp()

      });


      message.innerHTML =
        '<div class="success">✅ Tournament successfully created!</div>';


      document.getElementById("tournamentName").value = "";
      document.getElementById("gameName").value = "";
      document.getElementById("entryFee").value = "";
      document.getElementById("prize").value = "";
      document.getElementById("tournamentDate").value = "";


      loadTournaments();

    } catch (error) {

      console.error(error);

      message.innerHTML =
        '<div class="error">❌ Error: ' +
        error.message +
        '</div>';

    }

  };


  // REGISTER PLAYER
  window.registerPlayer = async function () {

    const name =
      document.getElementById("playerName").value.trim();

    const uid =
      document.getElementById("playerUid").value.trim();

    const phone =
      document.getElementById("playerPhone").value.trim();

    const message =
      document.getElementById("playerMessage");


    if (!name || !uid || !phone) {

      message.innerHTML =
        '<div class="error">⚠️ Sabhi fields fill karo.</div>';

      return;
    }


    try {

      await addDoc(collection(db, "players"), {

        name: name,

        uid: uid,

        phone: phone,

        createdAt: serverTimestamp()

      });


      message.innerHTML =
        '<div class="success">✅ Player registered successfully!</div>';


      document.getElementById("playerName").value = "";
      document.getElementById("playerUid").value = "";
      document.getElementById("playerPhone").value = "";


    } catch (error) {

      console.error(error);

      message.innerHTML =
        '<div class="error">❌ Error: ' +
        error.message +
        '</div>';

    }

  };


  // LOAD TOURNAMENTS
  async function loadTournaments() {

    const list =
      document.getElementById("tournamentList");


    try {

      const snapshot =
        await getDocs(collection(db, "tournaments"));


      if (snapshot.empty) {

        list.innerHTML =
          "Abhi koi tournament available nahi hai.";

        return;

      }


      list.innerHTML = "";


      snapshot.forEach((doc) => {

        const data = doc.data();


        const div =
          document.createElement("div");


        div.className = "tournament";


        div.innerHTML = `

          <h3>🏆 ${data.name || "Tournament"}</h3>

          <div class="info">

            🎮 Game: ${data.game || "-"}<br>

            💰 Entry Fee: ₹${data.entryFee || "0"}<br>

            🏆 Prize: ₹${data.prize || "0"}<br>

            📅 Date: ${data.date || "-"}

          </div>

        `;


        list.appendChild(div);

      });


    } catch (error) {

      console.error(error);

      list.innerHTML =
        "❌ Tournament load nahi ho paaye.";

    }

  }


  // START
  loadTournaments();

</script>

</body>
      </html>
